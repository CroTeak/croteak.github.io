<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <title>CroTeak - Umjetna tikovina</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fontovi -->
  <link href="https://fonts.cdnfonts.com/css/yesteryear" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --gold:#ffdd99;
      --gold-hover:#e6c87f;
      --overlay: rgba(0,0,0,0.55);
    }

    body{
      margin:0;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
    }

    /* Top bar */
    .topbar{
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }

    /* Lijeva strana (kontakt podaci) */
    .contact-info{
      font-size: 0.9rem;
      line-height: 1.3;
      color: #eee;
    }

    /* Desna strana (navigacija) */
    .nav a{
      text-decoration: none;
      background: var(--gold);
      color: #333;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      margin-left: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      transition: background .2s ease, transform .12s ease;
    }
    .nav a:hover{
      background: var(--gold-hover);
      transform: translateY(-1px);
    }

    /* Overlay */
    .overlay{
      background: var(--overlay);
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 80px 16px 40px;
    }

    /* Hero */
    .hero{
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }
    .logo{
      max-width: 200px;
      margin-bottom: 16px;
    }
    h1{
      font-family: 'Yesteryear', cursive;
      font-size: 4rem;
      margin: 10px 0 6px;
      color: var(--gold);
    }
    .subtitle{
      margin: 0 auto 18px;
      font-size: 1.15rem;
      max-width: 700px;
      opacity: .95;
    }
    .cta{
      display: inline-block;
      background: var(--gold);
      color: #333;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      text-decoration: none;
      font-size: 1rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      transition: background .2s ease, transform .12s ease;
    }
    .cta:hover{
      background: var(--gold-hover);
      transform: translateY(-1px);
    }

    @media (max-width: 600px){
      h1{ font-size: 3rem; }
      .logo{ max-width: 160px; }
      .nav a{ font-size: 0.9rem; padding: 8px 14px; }
      .contact-info{ font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- Gornja traka -->
  <div class="topbar">
    <!-- Lijevo: broj i mail -->
    <div class="contact-info">
      <div>📞 099/411-9579</div>
      <div>✉ valentino.soban@gmail.com</div>
    </div>

    <!-- Desno: navigacija -->
    <div class="nav">
      <a href="info-cjenik.html">Info Cjenik</a>
      <a href="zavrseni-radovi.html" style="margin-left:10px; margin-bottom:8px;">Završeni radovi</a>
      <a href="o-tikovini.html">O Tikovini</a>
    </div>
  </div>

  <!-- Hero sekcija -->
  <div class="overlay">
    <div class="hero">
      <img src="logo.png" alt="CroTeak logo" class="logo">
      <h1>CroTeak</h1>
      <p class="subtitle">
        Dobrodošli na službenu stranicu CroTeak.<br>
        Izrada i obrada umjetne tikovine za brodove i jahte.
      </p>
      <a class="cta" href="mailto:soban.valentino@gmail.com">Kontaktirajte nas</a>
    </div>
  </div>

</body>
</html>
