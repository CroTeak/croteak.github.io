<!DOCTYPE html>
<html lang="hr">
<head>
  <meta name="description" content="CroTeak - izrada i obrada umjetne tikovine od EVA foam materijala za brodove i jahte. Završeni radovi, info cjenik i kontakt.">
<meta name="keywords" content="CroTeak, umjetna tikovina, EVA foam, brodovi, jahte, paluba">
 <meta name="google-site-verification" content="94d4b4ab21687c42" /> 
  <meta name="google-site-verification" content="0v2do-ae2EwxzOXzWdrvYT47CTajWWIfSa9LMc1gkIc" />
<meta charset="UTF-8">
<title>CroTeak - Umjetna tikovina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Fontovi -->
<link href="https://fonts.cdnfonts.com/css/yesteryear" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--gold:#ffdd99;
--gold-hover:#e6c87f;
--overlay: rgba(0,0,0,0.55);
}

body{
margin:0;
background: url('background.jpg') no-repeat center center fixed;
background-size: cover;
font-family: 'Montserrat', sans-serif;
color: #fff;
}

/* Top bar */
.topbar{
position: fixed;
top: 12px; left: 12px; right: 12px;
display: flex; align-items: flex-start; justify-content: space-between;
z-index: 9999;
}

/* Kontakt lijevo */
.contact-info{ font-size: 0.9rem; line-height: 1.3; color:#eee; }

/* Navigacija (desktop) */
.nav a{
text-decoration: none;
  background: #ffdd99; color:#333;
  background: #ffdd99; color:#333;
padding: 12px 18px;
border-radius: 10px; font-weight: 700; font-size: 1rem;
margin-left: 10px;
box-shadow: 0 6px 18px rgba(0,0,0,0.25);
transition: background .2s ease, transform .12s ease;
display: inline-block;
}
.nav a:hover{ background:#e6c87f; transform: translateY(-1px); }

/* Hamburger gumb (skriven na desktopu) */
.menu-btn{
display: none;
  background: #ffdd99; color:#333;
  background: #ffdd99; color:#333;
border: 0; border-radius: 10px;
padding: 10px 14px; font-size: 1.2rem; font-weight: 800;
box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

/* MOBILNI prikaz */
@media (max-width: 680px){
.menu-btn{ display: inline-flex; align-items:center; justify-content:center; }

.nav{
position: absolute; top: 52px; right: 12px;
background: rgba(255,255,255,0.96);
border-radius: 12px;
padding: 8px;
box-shadow: 0 12px 28px rgba(0,0,0,0.28);
display: none;
}
.nav a{
display: block;
margin: 6px 4px;
background: transparent;
box-shadow: none;
border-radius: 8px;
padding: 12px 14px;
font-size: 1rem;
color:#111;
}
.nav a:hover{ background: rgba(0,0,0,0.06); transform: none; }

.contact-info{ font-size: 0.85rem; }
}

/* Klasa koja otvara meni */
.nav.open{ display: block; }

/* Overlay */
.overlay{
background: var(--overlay);
min-height: 100vh;
display: grid;
place-items: center;
text-align: center;
padding: 80px 16px 40px;
}

/* Hero */
.hero{
max-width: 900px;
margin: 0 auto;
padding: 24px;
}
.logo{
max-width: 200px;
margin-bottom: 16px;
}
h1{
font-family: 'Yesteryear', cursive;
font-size: 4rem;
margin: 10px 0 6px;
color: var(--gold);
}
.subtitle{
margin: 0 auto 18px;
font-size: 1.15rem;
max-width: 700px;
opacity: .95;
}
.cta{
display: inline-block;
background: var(--gold);
color: #333;
padding: 12px 24px;
border-radius: 30px;
font-weight: 700;
text-decoration: none;
font-size: 1rem;
box-shadow: 0 6px 18px rgba(0,0,0,0.25);
transition: background .2s ease, transform .12s ease;
}
.cta:hover{
background: var(--gold-hover);
transform: translateY(-1px);
}

@media (max-width: 600px){
h1{ font-size: 3rem; }
.logo{ max-width: 160px; }
.nav a{ font-size: 0.9rem; padding: 8px 14px; }
.contact-info{ font-size: 0.8rem; }
}
</style>
</head>
<body>

<!-- Gornja traka -->
<div class="topbar">
<!-- Lijevo: kontakt -->
<div class="contact-info">
<div>📞 099/411-9579</div>
<div>✉ valentino.soban@gmail.com</div>
</div>

<!-- Desno: gumbi + hamburger -->
<button class="menu-btn" aria-label="Otvori izbornik" aria-expanded="false">☰</button>

<nav class="nav nav-col" id="site-nav">
<a href="info-cjenik.html">Info Cjenik</a>
<a href="zavrseni-radovi.html">Završeni radovi</a>
<a href="o-tikovini.html">O Tikovini</a>
</nav>
</div>

<!-- Hero sekcija -->
<div class="overlay">
<div class="hero">
<img src="CROTEAKLOGOTRANSPARENT2.png" alt="CroTeak logo" class="logo">
<p class="subtitle">
Dobrodošli na službenu stranicu CroTeak.<br>
Izrada i obrada umjetne tikovine za brodove i jahte.
</p>
<a class="cta" href="mailto:soban.valentino@gmail.com">Kontaktirajte nas</a>
</div>
</div>
<script>
(function(){
const btn = document.querySelector('.menu-btn');
const nav = document.getElementById('site-nav');
if(!btn || !nav) return;

btn.addEventListener('click', () => {
const opened = nav.classList.toggle('open');
btn.setAttribute('aria-expanded', opened ? 'true' : 'false');
});

document.addEventListener('click', (e)=>{
if(!nav.contains(e.target) && !btn.contains(e.target)){
nav.classList.remove('open');
btn.setAttribute('aria-expanded','false');
}
});

document.addEventListener('keydown', (e)=>{
if(e.key === 'Escape'){
nav.classList.remove('open');
btn.setAttribute('aria-expanded','false');
}
});
})();
</script>



</body>
</html>
